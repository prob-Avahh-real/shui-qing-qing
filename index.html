<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e4f2f8" />
  <title>水清清 · 水质检测专用</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e4f2f8;
      --bg-deep: #c8e4f0;
      --ink: #12303d;
      --ink-soft: #4a6a7a;
      --water: #0d6e8a;
      --water-deep: #084d62;
      --aqua: #3aa8c8;
      --foam: #f0f9fc;
      --alert: #c0392b;
      --warn: #c47a00;
      --ok: #1a8f6e;
      --paper: rgba(255, 255, 255, 0.78);
      --line: rgba(18, 48, 61, 0.1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font-display: "Fraunces", "Noto Sans SC", serif;
      --font-body: "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 10% -10%, #f5fbfe 0%, transparent 55%),
        radial-gradient(90% 60% at 100% 0%, #a8d8ea 0%, transparent 45%),
        linear-gradient(165deg, var(--bg), var(--bg-deep));
      background-attachment: fixed;
    }

    body {
      padding: calc(12px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
    }

    .app { max-width: 440px; margin: 0 auto; }

    .brand {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      animation: rise 0.7s ease both;
    }

    .brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 8vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--water-deep);
      line-height: 1;
    }

    .brand .tag {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      font-family: var(--font-mono);
    }

    .score-card {
      position: relative;
      padding: 24px 22px 20px;
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.92), rgba(228,242,248,0.6)),
        url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='1.5' fill='%230d6e8a' fill-opacity='0.08'/%3E%3C/svg%3E");
      border: 1px solid var(--line);
      margin-bottom: 14px;
      overflow: hidden;
      animation: rise 0.85s 0.05s ease both;
    }

    .score-card::after {
      content: "";
      position: absolute;
      right: -30px;
      bottom: -40px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(58,168,200,0.3), transparent 70%);
      pointer-events: none;
      animation: ripple 5s ease-in-out infinite;
    }

    .score-top {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .grade-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      background: var(--ink-soft);
      flex-shrink: 0;
    }

    .score-meta .score-line {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      color: var(--water-deep);
    }

    .score-meta .score-line span { font-size: 0.9rem; color: var(--ink-soft); font-weight: 500; }
    .score-meta .grade-label { font-size: 0.85rem; color: var(--ink-soft); margin-top: 4px; }

    .quality-banner {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      position: relative;
      z-index: 1;
    }
    .quality-banner.ok { background: rgba(26, 143, 110, 0.15); color: var(--ok); }
    .quality-banner.warn { background: rgba(196, 122, 0, 0.15); color: var(--warn); }
    .quality-banner.bad { background: rgba(192, 57, 43, 0.12); color: var(--alert); }

    .scene-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 12px;
      padding-bottom: 2px;
      animation: rise 0.9s 0.08s ease both;
    }

    .scene-tab {
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      color: var(--ink-soft);
      transition: border-color 0.2s, background 0.2s;
    }
    .scene-tab.active {
      border-color: var(--aqua);
      background: rgba(58, 168, 200, 0.18);
      color: var(--water-deep);
      font-weight: 600;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
      animation: rise 0.95s 0.1s ease both;
    }

    .metric {
      padding: 14px;
      border-radius: 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      transition: border-color 0.2s;
    }
    .metric.warn { border-color: var(--warn); }
    .metric.bad { border-color: var(--alert); }

    .metric .k { font-size: 0.72rem; color: var(--ink-soft); }
    .metric .v {
      font-family: var(--font-display);
      font-size: 1.35rem;
      margin-top: 4px;
      color: var(--water-deep);
    }

    .advice {
      font-size: 0.85rem;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-bottom: 14px;
      padding: 0 2px;
      animation: rise 1s 0.12s ease both;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      animation: rise 1s 0.14s ease both;
    }

    button, .btn {
      font-family: var(--font-body);
      font-size: 0.95rem;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: wait; }

    .btn-primary {
      background: var(--water);
      color: #f0f9fc;
      font-weight: 600;
      flex: 1;
    }
    .btn-primary:hover { background: var(--water-deep); }

    .btn-ghost {
      background: transparent;
      color: var(--water-deep);
      border: 1px solid var(--line);
    }

    .wear-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.75rem;
      color: var(--ink-soft);
    }

    .wear-badge {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--paper);
      cursor: pointer;
    }
    .wear-badge.on {
      border-color: var(--aqua);
      color: var(--water-deep);
      background: rgba(58, 168, 200, 0.18);
    }

    .status-line {
      font-size: 0.78rem;
      color: var(--ink-soft);
      min-height: 1.2em;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      margin: 18px 0 10px;
      color: var(--water-deep);
    }

    .history-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--paper);
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      transition: border-color 0.2s;
    }
    .history-item:hover { border-color: var(--aqua); }

    .hist-grade {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #fff;
      font-size: 0.95rem;
    }

    .hist-title { display: block; font-weight: 600; font-size: 0.88rem; }
    .hist-sub { display: block; font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft); margin-top: 2px; }
    .hist-score { font-family: var(--font-display); font-size: 1.2rem; color: var(--water); }

    .empty { text-align: center; padding: 20px; color: var(--ink-soft); font-size: 0.88rem; }
    .hidden { display: none !important; }

    select {
      flex: 1;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes ripple {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    @media (max-width: 280px), (max-height: 300px) {
      body { padding: 6px; }
      .brand h1 { font-size: 1.15rem; }
      .brand .tag, .wear-row, .scene-tabs { display: none; }
      .score-card { padding: 10px 12px; border-radius: 14px; }
      .grade-badge { width: 40px; height: 40px; font-size: 1.1rem; border-radius: 10px; }
      .score-meta .score-line { font-size: 1.3rem; }
      .metrics { gap: 6px; }
      .metric { padding: 8px; border-radius: 10px; }
      .metric .v { font-size: 1rem; }
      .btn-primary, .btn-ghost { padding: 8px 10px; font-size: 0.75rem; }
      .advice { font-size: 0.7rem; }
      .status-line { font-size: 0.65rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="brand">
      <h1>水清清</h1>
      <span class="tag">水质检测专用</span>
    </header>

    <section class="score-card">
      <div class="score-top">
        <div class="grade-badge" id="grade-badge">—</div>
        <div class="score-meta">
          <div class="score-line"><span id="score-value">—</span> <span>分</span></div>
          <div class="grade-label" id="grade-label">等待检测</div>
        </div>
      </div>
      <div class="quality-banner hidden" id="quality-banner"></div>
    </section>

    <div class="scene-tabs" id="scene-tabs"></div>

    <div class="metrics">
      <div class="metric">
        <div class="k">pH 酸碱度</div>
        <div class="v" id="metric-ph">—</div>
      </div>
      <div class="metric">
        <div class="k">TDS ppm</div>
        <div class="v" id="metric-tds">—</div>
      </div>
      <div class="metric">
        <div class="k">水温 ℃</div>
        <div class="v" id="metric-tempC">—</div>
      </div>
      <div class="metric">
        <div class="k">浊度 NTU</div>
        <div class="v" id="metric-turbidity">—</div>
      </div>
    </div>

    <p class="advice" id="advice-text">浸没探针后点击「检测」，无硬件时使用模拟数据。</p>

    <div class="toolbar">
      <button type="button" class="btn-primary" id="btn-measure">检测</button>
      <button type="button" class="btn-ghost" id="btn-save">保存</button>
      <button type="button" class="btn-ghost" id="btn-connect" title="连接 BLE 探针">BLE</button>
    </div>

    <div class="toolbar">
      <select id="scene-select" aria-label="检测场景">
        <option value="drinking">💧 饮用水</option>
        <option value="pool">🏊 泳池/浴池</option>
        <option value="aquarium">🐠 水族/养殖</option>
      </select>
    </div>

    <div class="wear-row">
      <span class="wear-badge" id="ring-badge">戒指 · 倾斜换场景 · 甩动检测</span>
      <span class="wear-badge" id="cane-badge">手杖 · 敲击保存</span>
    </div>

    <div class="status-line" id="status"></div>

    <h2 class="section-title">检测记录</h2>
    <ul class="history-list" id="history-list"></ul>
    <div class="empty hidden" id="history-empty">暂无记录，完成检测后点「保存」。</div>
    <div class="toolbar" style="margin-top:10px">
      <button type="button" class="btn-ghost" id="btn-clear-history">清空记录</button>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
